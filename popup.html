<!DOCTYPE html>
<html>
<head>
  <title>ITF Tennis Data Crawler</title>
  <style>
    body {
      width: 400px;
      padding: 15px;
      font-family: Arial, sans-serif;
    }
    .container {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    .row {
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .date-filters {
      display: flex;
      gap: 10px;
      align-items: center;
    }
    select {
      padding: 8px;
      border: 1px solid #ddd;
      border-radius: 4px;
      background-color: white;
    }
    button {
      padding: 8px 16px;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      min-width: 120px;
    }
    button:hover {
      background-color: #45a049;
    }
    button:disabled {
      background-color: #cccccc;
      cursor: not-allowed;
    }
    #status {
      margin-top: 10px;
      padding: 10px;
      border-radius: 4px;
      display: none;
    }
    .success {
      background-color: #dff0d8;
      color: #3c763d;
    }
    .error {
      background-color: #f2dede;
      color: #a94442;
    }
    label {
      font-weight: bold;
      min-width: 50px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>ITF Tennis Data Crawler</h2>
    <div class="row">
      <button id="startCrawl">Start Crawling</button>
      <button id="exportCSV">Export to CSV</button>
    </div>
    <div class="row">
      <button id="crawlLeague">Crawl League</button>
      <div class="date-filters">
        <label>Month:</label>
        <select id="monthSelect"></select>
        <label>Year:</label>
        <select id="yearSelect"></select>
      </div>
    </div>
    <div id="status"></div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
