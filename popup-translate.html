<!DOCTYPE html>
<html>

<head>
  <title>Translator</title>
  <style>
    body {
      width: 1200px;
      padding: 15px;
      font-family: Arial, sans-serif;
    }

    .container {
      overflow-x: auto;
    }

    .container {
      display: flex;
      flex-direction: column;
      gap: 15px;
      min-width: 1170px;
      /* 1200px - 2*15px padding */
    }

    .row {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    select {
      padding: 8px;
      border: 1px solid #ddd;
      border-radius: 4px;
      background-color: white;
    }

    button {
      padding: 8px 16px;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      min-width: 120px;
    }

    button:hover {
      background-color: #45a049;
    }

    button:disabled {
      background-color: #cccccc;
      cursor: not-allowed;
    }

    .status-message {
      margin-top: 10px;
      padding: 10px;
      border-radius: 4px;
      display: none;
      clear: both;
    }

    .success {
      background-color: #dff0d8;
      color: #3c763d;
    }

    .error {
      background-color: #f2dede;
      color: #a94442;
    }

    label {
      font-weight: bold;
      min-width: 50px;
    }
  </style>
</head>

<body>
  <div class="container">
    <h2>Translator</h2>
    <div class="row">
      <button id="home-btn" type="button">Home</button>
    </div>
    <div class="row tennis">
      <button id="tennis-crawl-btn" type="button">Crawl Live Tennis</button>
      <button id="tennis-push-btn" type="button">Push Live Tennis</button>
      <div class="status-message"></div>
    </div>
    <div class="row soccer">
      <button id="soccer-crawl-btn" type="button">Crawl 7m.com Soccer</button>
      <button id="soccer-push-btn" type="button">Push 7m.com Soccer</button>
      <div class="status-message"></div>
    </div>
    <div class="row basketball">
      <button id="basketball-crawl-btn" type="button">Crawl 7m.com Basketball</button>
      <button id="basketball-push-btn" type="button">Push 7m.com Basketball</button>
      <div class="status-message"></div>
    </div>
    <div class="row badminton">
      <button id="badminton-crawl-btn" type="button">Crawl Badminton</button>
      <button id="badminton-push-btn" type="button">Push Badminton</button>
      <div class="status-message"></div>
    </div>
    
    <script src="jquery.min.js"></script>
    <script src="popup-translate.js"></script>
    <script src="popup-translate-live-tennis-params.js"></script>
    <script src="popup-translate-live-tennis.js"></script>
    <script src="popup-translate-7m.js"></script>
    <script src="popup-translate-badminton-params.js"></script>
    <script src="popup-translate-badminton.js"></script>
</body>

</html>
